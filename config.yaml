# ScoutMe MVP Match Analysis Configuration
# This file centralizes all parameters for the AI pipeline and MLOps workflow.

# === 1. Model Configuration ===
models:
  player_detection: 'data/football-player-detection.pt'
  ball_detection: 'data/football-ball-detection.pt'
  pitch_detection: 'data/football-pitch-detection.pt'
  vlm_molmo: 'allenai/Molmo-7B-D-0924'
  vlm_qwen: 'Qwen/Qwen2.5-VL-7B-Instruct' # Optional
  device: 'cuda' # or 'cpu'
  quantization:
    load_in_4bit: true
    use_double_quant: true
    quant_type: 'nf4'

# === 2. Match Context & Team Identification ===
match_context:
  team_a_name: 'Blue'
  team_b_name: 'White'
  auto_detect_teams: true
  
  # CEO Requirements (Auto-filled by pipeline, or set manually)
  h1_start: null
  h1_end: null
  h2_start: null
  h2_end: null
  
  # Team directions (Auto-detected)
  team1_defending_side_h1: 'left' # or 'right'
  auto_swap_second_half: true

# === 3. Detection Parameters (Tuned for 85%+ Accuracy) ===
detection:
  ball_proximity_px: 65
  event_cooldown_frames: 50
  min_pass_distance_px: 60
  min_ownership_frames: 10
  confidence_threshold: 75
  temporal_buffer_size: 75

# === 4. Feature Zones & Classification ===
zones:
  sideline_margin: 0.008
  cross_zone_width: 0.18
  header_height_ratio: 0.10
  short_pass_threshold_px: 150
  long_pass_threshold_px: 300

# === 5. VLM Logic Settings ===
vlm:
  enabled: true
  stage1_pass_verification: true
  stage2_type_classification: true
  crop_size: 450
  is_primary_classifier: true

# === 6. MVP Module Settings ===
modules:
  half_detector:
    enabled: true
    playing_threshold: 0.65
    break_threshold: 0.30
  team_direction:
    enabled: true
  gk_save_detector:
    enabled: true
  video_enhancer:
    enabled: true
    optimizer_level: 'auto'

# === 7. MLOps / Pipeline Settings ===
pipeline:
  input_video_dir: 'input_video'
  save_annotated_video: true
  save_json_results: true
  api_enabled: true
  api_url: 'https://api.scoutme.cloud/'
  api_key: 'sk_smo_9f3cA1b8E2D4F6a9B7C0XyZQmPkyam'
  
  # AUTO-SHUTDOWN (The Kill Switch for A100 cost saving)
  auto_shutdown_enabled: true
  shutdown_delay_seconds: 10
